<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ef" />
    <title>Печной двор — Заказы</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div>
          <p class="eyebrow">ПЕЧНОЙ ДВОР</p>
          <h1>Заказы</h1>
        </div>
        <button id="refresh-button" class="icon-button" type="button" aria-label="Обновить список" title="Обновить">
          ↻
        </button>
      </header>

      <section class="summary" aria-live="polite">
        <div>
          <span id="order-count">—</span>
          <small>всего заказов</small>
        </div>
        <p id="sync-status">Загрузка…</p>
      </section>

      <p id="app-error" class="app-error" hidden></p>
      <section id="orders" class="orders-grid" aria-live="polite"></section>

      <template id="empty-state-template">
        <div class="empty-state">
          <div class="empty-icon">▤</div>
          <h2>Заказов пока нет</h2>
          <p>Перешлите боту сообщение с заказом — он сразу появится здесь.</p>
        </div>
      </template>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
